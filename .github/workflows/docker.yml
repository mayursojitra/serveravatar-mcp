name: docker

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Read-only token: these jobs only check out and test the code.
permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Prepare settings
        run: |
          {
            echo "APP_URL=https://mcp.example.test"
            echo "APP_KEY=base64:$(openssl rand -base64 32)"
            echo "DB_PASSWORD=$(openssl rand -hex 16)"
          } > .env

      - name: Build and start
        run: docker compose up -d --build

      - name: Wait until the app is healthy, then smoke test
        run: bash .github/scripts/docker-smoke-test.sh

      - name: Show logs on failure
        if: failure()
        run: docker compose logs

      - name: Stop
        if: always()
        run: docker compose down -v
