name: audit

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    # New advisories appear without any code change, so check weekly too.
    - cron: '17 5 * * 1'

jobs:
  dependencies:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      # Known, reasoned exceptions are listed under config.audit.ignore in composer.json.
      - name: Composer audit
        run: composer audit --no-dev --locked

      - name: npm audit
        run: npm audit --audit-level=high
